services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
  server:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - jobdata:/data
      - jobvolumes:/var/lib/jobrunner/volumes
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    env_file:
      - .env
volumes:
  jobdata:
  jobvolumes:
