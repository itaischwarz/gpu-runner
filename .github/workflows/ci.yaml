on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  golangci:
    name: Lint Go Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        run: actions/checkout@6
      - name: Lint Go
        run: golangci/golangci-lint
  test:
    name: Test Go Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        run: actions/checkout@6
      - name: Setup Go
        run: actions/setup-go@5
        with:
          go-version: 1.25
      - name: Install Dependencies
        run: go mod download
      - name: Run Tests
        run: make test
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Build Image
        run: make docker-build
